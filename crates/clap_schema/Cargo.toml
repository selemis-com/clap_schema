[package]
name = "clap_schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Machine-readable command discovery and handler-derived JSON output schemas for Clap"
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/clap_schema"
keywords = ["clap", "agents", "cli", "schema", "json-schema"]
categories = ["command-line-interface", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--show-type-layout",
]

[lints]
workspace = true

[dependencies]
# Vendor
clap = { workspace = true, features = ["usage"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Crates
clap_schema_derive.workspace = true

[dev-dependencies]
# Vendor
clap = { workspace = true, features = ["derive"] }
snapbox = { version = "1.2.2", features = ["cmd", "examples"] }
