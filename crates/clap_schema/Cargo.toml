[package]
name = "clap_schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Checked machine-output contracts for clap applications"
license.workspace = true
readme = "../../README.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/clap_schema"
keywords = ["clap", "agents", "cli", "schema", "json-schema"]
categories = ["command-line-interface", "development-tools"]

[lints]
workspace = true

[dependencies]
# Vendor
clap = { workspace = true, features = ["usage"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Crates
clap_schema_derive.workspace = true

[dev-dependencies]
# Vendor
clap = { workspace = true, features = ["derive", "env"] }
snapbox.workspace = true


[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
